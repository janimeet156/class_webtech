<html>
<head><center>
<title>css filter example </title>
<style>
		img {
				width: 500px;
				filter: grayscale(100%);
				transition: 0.5s;
		}
		
		img:hover { 
					filter: grayscale(0%) brightness(120%);
		}
</style>
</head>
<body>
		<h2>scc filter property</h2>
		
		<img src="cat.jpg" alt="cat">
</body></center>
</html>
